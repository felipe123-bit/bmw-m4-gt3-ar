<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0d">
<title>BMW M4 GT3 · AR con marcador</title>
<script>
  // Diagnóstico: se instala antes de AR.js para interceptar getUserMedia
  window.__diag = {gum:'sin llamar todavía', errs:[]};
  try{
    var md = navigator.mediaDevices;
    if (md && md.getUserMedia){
      var orig = md.getUserMedia.bind(md);
      md.getUserMedia = function(c){
        window.__diag.gum = 'pidiendo cámara…';
        return orig(c).then(function(st){ window.__diag.gum = 'OK'; return st; },
          function(e){ window.__diag.gum = 'ERROR ' + (e && e.name) + ': ' + (e && e.message); throw e; });
      };
    } else { window.__diag.gum = 'ERROR: navigator.mediaDevices no existe (¿sin HTTPS?)'; }
  }catch(e){ window.__diag.gum = 'ERROR al instalar hook: ' + e; }
  window.addEventListener('error', function(e){ window.__diag.errs.push(String(e.message||e) + (e.filename?' @'+e.filename.split('/').pop():'')); });
  window.addEventListener('unhandledrejection', function(e){ window.__diag.errs.push('promesa: ' + (e.reason && (e.reason.message||e.reason))); });
</script>
<script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>
<style>
  :root{--bg:#0b0b0d;--surface:rgba(22,22,26,.92);--text:#f2f2f4;--muted:#9a9aa3;--accent:#FF5500;--line:#2a2a31}
  *{box-sizing:border-box;margin:0}
  /* El <video> de AR.js usa z-index:-2: el fondo oscuro va SOLO en html; body debe ser transparente */
  html{background:var(--bg)}
  html,body{height:100%;overflow:hidden;color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  body{background:transparent}
  #diag{position:fixed;left:8px;right:8px;top:50%;transform:translateY(-50%);z-index:20;max-height:40dvh;overflow:auto;
    background:rgba(0,0,0,.82);border:1px solid var(--accent);border-radius:12px;padding:8px 10px;
    font:12px/1.45 ui-monospace,Menlo,Consolas,monospace;color:#eee;pointer-events:auto}
  #diag b{color:var(--accent)} #diag .ok{color:#4ade80} #diag .bad{color:#f87171}
  #diag button{float:right;margin-left:8px;background:#222;color:#eee;border:1px solid #555;border-radius:8px;padding:2px 8px;font:inherit}
  .ui{position:fixed;left:0;right:0;z-index:10;padding:0 16px;pointer-events:none}
  .ui > *{pointer-events:auto}
  #top{top:0;padding-top:max(14px,env(safe-area-inset-top))}
  #bottom{bottom:0;padding-bottom:max(14px,env(safe-area-inset-bottom))}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;
    backdrop-filter:blur(8px)}
  .tag{color:var(--accent);font-size:.7rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase}
  h1{font-size:1.15rem;margin-top:2px}
  #hint{margin-top:6px;font-size:.95rem;color:var(--text)}
  #hint.found{color:var(--accent)}
  .modes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .modes button{min-height:48px;border-radius:12px;border:1px solid var(--line);background:#1d1d22;
    color:var(--text);font:700 1rem system-ui,sans-serif;cursor:pointer}
  .modes button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff;
    box-shadow:0 6px 20px rgba(255,85,0,.35)}
  .modes button:focus-visible,#cm:focus-visible{outline:3px solid #fff;outline-offset:2px}
  .row{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:.9rem;color:var(--muted)}
  .row[hidden]{display:none}
  #cm{width:84px;min-height:44px;border-radius:10px;border:1px solid var(--line);background:#0f0f12;
    color:var(--text);font:600 1rem system-ui,sans-serif;padding:0 10px;text-align:right}
  #info{margin-top:8px;font-size:.8rem;color:var(--muted);line-height:1.35}
  #info b{color:var(--text)}
</style>
</head>
<body>
<div id="top" class="ui"><div class="card">
  <div class="tag">Realidad aumentada · marcador</div>
  <h1>BMW M4 GT3 <span style="color:var(--accent)">2021</span></h1>
  <p id="hint">Apuntá la cámara al marcador</p>
</div></div>

<div id="bottom" class="ui"><div class="card">
  <div class="modes" role="group" aria-label="Escala">
    <button id="btn-mini" aria-pressed="true">Mini</button>
    <button id="btn-maqueta" aria-pressed="false">Maqueta</button>
    <button id="btn-real" aria-pressed="false">Real</button>
  </div>
  <div class="modes" style="grid-template-columns:1fr 2fr;margin-top:10px">
    <button id="btn-base" aria-pressed="true">Base</button>
    <button id="btn-pantalla" aria-pressed="false">Marcador en pantalla</button>
  </div>
  <label class="row" id="cm-row" for="cm" hidden>
    Lado del marcador impreso
    <input id="cm" type="number" inputmode="decimal" min="5" max="200" step="0.5" value="15"> cm
  </label>
  <p id="info"></p>
</div></div>

<div id="diag" aria-live="polite"><button id="diag-x" type="button">ocultar</button><b>Diagnóstico</b><div id="diag-body">…</div></div>

<a-scene vr-mode-ui="enabled: false"
         renderer="logarithmicDepthBuffer: true; alpha: true"
         arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono; trackingMethod: best;">
  <a-light type="ambient" intensity="0.9"></a-light>
  <a-light type="directional" intensity="1.1" position="1 3 2"></a-light>

  <!-- Suavizado: promedia las últimas 16 poses; ignora movimientos < 0.015 y exige 4 frames para aceptar un salto -->
  <a-marker id="marker" preset="hiro" smooth="true" smoothCount="16" smoothTolerance="0.015" smoothThreshold="4">
    <!-- Modelo en metros, base en y=0, centrado, frente hacia +Z (borde inferior del marcador = lado del usuario) -->
    <!-- Base oscura que tapa el Hiro (plano del marcador, siempre horizontal) -->
    <a-entity id="base"></a-entity>
    <!-- Sombra de contacto: sigue la rotación del auto (modo marcador en pantalla) -->
    <a-entity id="floor"><a-entity id="shadow"></a-entity></a-entity>
    <a-entity id="car" gltf-model="../bmw_m4_gt3_real.glb" position="0 0 0" rotation="0 0 0"></a-entity>
  </a-marker>
  <a-entity camera></a-entity>
</a-scene>

<script>
  // 1 unidad de A-Frame = lado del marcador. El modelo está en metros.
  var CAR_LEN_M = 5.02;      // largo real del auto (medido en el .glb)
  var MAQUETTE_LEN = 3;      // maqueta: el auto mide 3 anchos de marcador
  var MINI_LEN_CM = 25;      // mini: el auto mide 25 cm reales sin importar el marcador

  // Escala (multiplicador del modelo) según modo y tamaño impreso
  function carScale(mode, markerCm){
    if (mode === 'mini') return (MINI_LEN_CM / markerCm) / CAR_LEN_M;   // largo en marcadores = 25/cm
    if (mode === 'maqueta') return MAQUETTE_LEN / CAR_LEN_M;
    return 100 / markerCm;   // 1 m real = (100/cm) lados de marcador
  }

  // ---- Suelo: base oscura difuminada + sombra de contacto (texturas de canvas, sin shadow maps) ----
  var fp = {x: 4.0, z: 1.9};   // huella del auto en metros (se reemplaza al cargar el modelo)

  // Textura de rectángulo redondeado con borde difuminado. core = semilado totalmente opaco, edge = semilado donde llega a 0 (ambos 0..1)
  function softRectTexture(rgb, peak, core, edge, radius){
    var N = 256, c = document.createElement('canvas'); c.width = c.height = N;
    var g = c.getContext('2d'), img = g.createImageData(N, N), d = img.data;
    for (var j = 0; j < N; j++) for (var i = 0; i < N; i++){
      var x = Math.abs((i + .5) / N * 2 - 1), y = Math.abs((j + .5) / N * 2 - 1);
      var qx = Math.max(x - (core - radius), 0), qy = Math.max(y - (core - radius), 0);
      var dist = Math.sqrt(qx * qx + qy * qy) - radius;            // distancia al rect. redondeado del núcleo
      var t = Math.min(Math.max(dist / (edge - core), 0), 1);
      var a = peak * (1 - t * t * (3 - 2 * t));                    // smoothstep
      var k = (j * N + i) * 4; d[k] = rgb[0]; d[k+1] = rgb[1]; d[k+2] = rgb[2]; d[k+3] = Math.round(a * 255);
    }
    g.putImageData(img, 0, 0);
    var tex = new THREE.CanvasTexture(c); tex.minFilter = THREE.LinearFilter; tex.generateMipmaps = false;
    return tex;
  }
  function softPlane(tex, order){
    var geo = new THREE.PlaneGeometry(1, 1); geo.rotateX(-Math.PI / 2);
    var mat = new THREE.MeshBasicMaterial({map: tex, transparent: true, depthWrite: false, fog: false});
    var m = new THREE.Mesh(geo, mat); m.renderOrder = order; return m;
  }
  var baseEl = document.getElementById('base'), shadowEl = document.getElementById('shadow'), floorEl = document.getElementById('floor');
  // Base: lado 2 marcadores; núcleo opaco de 1.3 (el Hiro mide 1 + ~9% de margen blanco), difumina hasta 2.0
  baseEl.setObject3D('mesh', softPlane(softRectTexture([18, 18, 20], 1, 0.65, 1.0, 0.25), 1));
  baseEl.object3D.scale.set(2, 1, 2); baseEl.object3D.position.y = -0.0005;
  // Sombra: negro suave, más grande que la huella (escala en apply())
  shadowEl.setObject3D('mesh', softPlane(softRectTexture([0, 0, 0], 0.7, 0.55, 1.0, 0.4), 2));
  shadowEl.object3D.position.y = 0.0005;

  var SHADOW_GROW = 1.3;
  var mode = 'mini';
  var car = document.getElementById('car');
  var cmInput = document.getElementById('cm');
  var info = document.getElementById('info');

  function markerCm(){
    var v = parseFloat(String(cmInput.value).replace(',', '.'));
    return (v >= 5 && v <= 200) ? v : 15;
  }

  function apply(){
    var cm = markerCm(), k = carScale(mode, cm);
    car.setAttribute('scale', k + ' ' + k + ' ' + k);
    shadowEl.object3D.scale.set(fp.x * SHADOW_GROW * k, 1, fp.z * SHADOW_GROW * k);
    var lenMarkers = CAR_LEN_M * k;
    if (mode === 'mini'){
      info.innerHTML = 'Mini: marcador de <b>' + cm + ' cm</b> → el auto mide <b>' + MINI_LEN_CM + ' cm</b> (' +
        lenMarkers.toFixed(2).replace('.', ',') + ' marcadores).';
    } else if (mode === 'maqueta'){
      info.innerHTML = 'Maqueta: el auto mide <b>' + lenMarkers.toFixed(1).replace('.', ',') + ' marcadores</b> de largo.';
    } else {
      info.innerHTML = 'Marcador de <b>' + cm + ' cm</b> → el auto mide <b>' +
        lenMarkers.toFixed(1).replace('.', ',') + ' marcadores</b> = ' +
        CAR_LEN_M.toFixed(2).replace('.', ',') + ' m reales.';
    }
  }

  function setMode(m){
    mode = m;
    document.getElementById('btn-mini').setAttribute('aria-pressed', m === 'mini');
    document.getElementById('btn-maqueta').setAttribute('aria-pressed', m === 'maqueta');
    document.getElementById('btn-real').setAttribute('aria-pressed', m === 'real');
    document.getElementById('cm-row').hidden = (m === 'maqueta');
    apply();
  }

  document.getElementById('btn-mini').addEventListener('click', function(){ setMode('mini'); });
  document.getElementById('btn-maqueta').addEventListener('click', function(){ setMode('maqueta'); });
  document.getElementById('btn-real').addEventListener('click', function(){ setMode('real'); });
  cmInput.addEventListener('input', apply);

  // Marcador en pantalla (monitor vertical): el auto gira -90° en X para verse derecho. Apagado = marcador en mesa.
  document.getElementById('btn-pantalla').addEventListener('click', function(){
    var on = this.getAttribute('aria-pressed') !== 'true';
    this.setAttribute('aria-pressed', on);
    var rot = (on ? '-90 0 0' : '0 0 0');
    car.setAttribute('rotation', rot); floorEl.setAttribute('rotation', rot);
  });

  document.getElementById('btn-base').addEventListener('click', function(){
    var on = this.getAttribute('aria-pressed') !== 'true';
    this.setAttribute('aria-pressed', on);
    baseEl.object3D.visible = on;
  });

  var hint = document.getElementById('hint'), marker = document.getElementById('marker');
  marker.addEventListener('markerFound', function(){ hint.textContent = 'Marcador detectado'; hint.className = 'found'; });
  marker.addEventListener('markerLost',  function(){ hint.textContent = 'Apuntá la cámara al marcador'; hint.className = ''; });

  setMode('mini');

  // ---- Recuadro de diagnóstico ----
  (function(){
    var body = document.getElementById('diag-body'), perm = 'consultando…', modelo = 'cargando…';
    document.getElementById('diag-x').addEventListener('click', function(){ document.getElementById('diag').style.display = 'none'; });
    try{
      if (navigator.permissions && navigator.permissions.query){
        navigator.permissions.query({name:'camera'}).then(function(p){
          perm = p.state; p.onchange = function(){ perm = p.state; };
        }, function(e){ perm = 'no disponible (' + e.name + ')'; });
      } else perm = 'no disponible en este navegador';
    }catch(e){ perm = 'no disponible'; }
    var carEl = document.getElementById('car'), t0 = Date.now(), meshes = 0, bbox = '';
    carEl.addEventListener('model-loaded', function(){
      modelo = 'OK';
      try{
        var root = carEl.getObject3D('mesh'); root.traverse(function(o){ if (o.isMesh) meshes++; });
        // Apoyar el auto en y=0 exacto y centrarlo en x/z (caja en coordenadas locales del auto, sin escala)
        var co = carEl.object3D; co.updateWorldMatrix(true, true);
        var b = new THREE.Box3().setFromObject(root).applyMatrix4(new THREE.Matrix4().copy(co.matrixWorld).invert());
        var ctr = b.getCenter(new THREE.Vector3());
        root.position.set(root.position.x - ctr.x, root.position.y - b.min.y, root.position.z - ctr.z);
        var sz0 = b.getSize(new THREE.Vector3()); fp = {x: sz0.x, z: sz0.z};
        apply();
      }catch(e){ modelo = 'OK pero sin malla: ' + e; }
    });
    carEl.addEventListener('model-error', function(e){ modelo = 'ERROR al cargar ' + (e.detail && (e.detail.src || e.detail.message || e.detail)); });
    function marcadorInfo(){
      try{
        var m = document.getElementById('marker').object3D, c = carEl.object3D;
        var box = new THREE.Box3().setFromObject(c), sz = box.getSize(new THREE.Vector3());
        var dist = m.position.length();
        return 'visible=' + m.visible + ' · distancia cámara↔marcador=' + dist.toFixed(2) + ' marcadores (~' + Math.round(dist * markerCm()) + ' cm)' +
               ' · auto ' + sz.x.toFixed(2) + '×' + sz.y.toFixed(2) + '×' + sz.z.toFixed(2) + ' marcadores (' + (Math.max(sz.x, sz.y, sz.z) * markerCm()).toFixed(1) + ' cm de largo) · y mín. (marcador)=' + box.clone().applyMatrix4(new THREE.Matrix4().copy(m.matrixWorld).invert()).min.y.toFixed(4) + ' · escala=' + carEl.object3D.scale.x.toFixed(3);
      }catch(e){ return 'n/d (' + e.message + ')'; }
    }
    function row(k, v, ok){ return '<div><b>' + k + ':</b> <span class="' + (ok===true?'ok':ok===false?'bad':'') + '">' + v + '</span></div>'; }
    function tick(){
      var v = document.getElementById('arjs-video'), act = false, det = 'no existe el <video>';
      if (v){
        var tr = v.srcObject && v.srcObject.getVideoTracks ? v.srcObject.getVideoTracks()[0] : null;
        act = !!(tr && tr.readyState === 'live' && !v.paused && v.videoWidth > 0);
        det = (act ? 'sí' : 'no') + ' · ' + v.videoWidth + '×' + v.videoHeight + ' · pausado=' + v.paused + ' · pista=' + (tr ? tr.readyState : 'ninguna');
      }
      var g = window.__diag.gum;
      body.innerHTML =
        row('HTTPS', window.isSecureContext ? 'sí' : 'NO', window.isSecureContext) +
        row('Permiso de cámara', perm, perm === 'granted' ? true : perm === 'denied' ? false : undefined) +
        row('getUserMedia', g, g === 'OK' ? true : g.indexOf('ERROR') === 0 ? false : undefined) +
        row('Video activo', det, act) +
        row('Modelo', (modelo === 'cargando…' && Date.now() - t0 > 15000 ? 'cargando… (más de 15 s, 5 MB: ¿red lenta?)' : modelo) + (modelo === 'OK' ? ' · ' + meshes + ' mallas' : ''), modelo === 'OK' ? true : modelo.indexOf('ERROR') === 0 ? false : undefined) +
        row('Pose', marcadorInfo()) +
        (window.__diag.errs.length ? row('Errores JS', window.__diag.errs.slice(-3).join(' | '), false) : '');
    }
    tick(); setInterval(tick, 1000);
  })();
</script>
</body>
</html>
